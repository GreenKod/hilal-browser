name: Build and Release

on:
  push:
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag (optional, leave empty for latest)"
        required: false

permissions:
  contents: write

jobs:
  create-release:
    if: github.repository_owner == github.actor

    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # DETERMINE TAG
      # =========================
      - name: Determine tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"

            if [ -z "$TAG" ]; then
              TAG=$(git tag --sort=-v:refname | head -n 1)
            fi
          else
            TAG="${{ github.ref_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "No tag found!"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # =========================
      # CREATE RELEASE
      # =========================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Hilal Browser ${{ steps.vars.outputs.tag }}"
          body: "Creating release ${{ steps.vars.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false